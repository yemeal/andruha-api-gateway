name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: local/${{ github.event.repository.name }}:ci
  DOCKER_BUILD_TARGET: runtime
  SEMGREP_IMAGE: semgrep/semgrep:latest
  SAST_BLOCKING_SEVERITY: ERROR
  TRIVY_VERSION: latest
  IMAGE_SCAN_SEVERITY: HIGH,CRITICAL
  IMAGE_SCAN_TIMEOUT: 5m
  REPORT_RETENTION_DAYS: "7"
  BUILD_ARTIFACT_RETENTION_DAYS: "1"

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ env.DOCKER_BUILD_TARGET }}
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export built image
        run: docker image save --output "${RUNNER_TEMP}/runtime-image.tar" "${IMAGE_NAME}"
      - name: Upload built image
        uses: actions/upload-artifact@v7
        with:
          name: runtime-image
          path: ${{ runner.temp }}/runtime-image.tar
          if-no-files-found: error
          retention-days: ${{ env.BUILD_ARTIFACT_RETENTION_DAYS }}
          overwrite: true

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout current security rules
        uses: actions/checkout@v7
        with:
          repository: semgrep/semgrep-rules
          path: .semgrep-rules
          sparse-checkout: ${{ env.SEMGREP_RULES }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
      - name: Scan source code
        run: |
          set -Eeuo pipefail
          report_dir="${RUNNER_TEMP}/semgrep"
          mkdir -p "${report_dir}"

          rule_args=()
          while IFS= read -r rule; do
            rule_args+=(--config "/rules/${rule}")
          done <<< "${SEMGREP_RULES}"

          mapfile -t targets <<< "${SAST_TARGETS}"
          docker run --rm --pull always --network none \
            --volume "${GITHUB_WORKSPACE}:/src:ro" \
            --volume "${GITHUB_WORKSPACE}/.semgrep-rules:/rules:ro" \
            --volume "${report_dir}:/reports" \
            --workdir /src \
            "${SEMGREP_IMAGE}" semgrep scan "${rule_args[@]}" \
            --metrics off --disable-version-check --no-git-ignore \
            --exclude tests --exclude scripts --exclude .venv \
            --json --output /reports/semgrep.json --sarif-output /reports/semgrep.sarif \
            "${targets[@]}"
        id: sast-scan
        shell: bash
      - name: Enforce SAST policy
        shell: bash
        run: |
          set -Eeuo pipefail
          report="${RUNNER_TEMP}/semgrep/semgrep.json"

          if ! jq -e 'all(.errors[];
            .level == "warn" and
            ((.type | if type == "array" then .[0] else . end) == "PartialParsing")
          )' "${report}" > /dev/null; then
            echo "::error::Semgrep reported analysis errors. See the semgrep-sast artifact."
            exit 1
          fi

          partial_count="$(jq '.errors | length' "${report}")"
          if (( partial_count > 0 )); then
            echo "::warning::Semgrep reported ${partial_count} partial parse warnings. See the semgrep-sast artifact."
          fi

          if ! jq -e --arg severity "${SAST_BLOCKING_SEVERITY}" \
            'all(.results[]; .extra.severity != $severity)' "${report}" > /dev/null; then
            echo "::error::Semgrep found issues at ${SAST_BLOCKING_SEVERITY}. See the semgrep-sast artifact."
            exit 1
          fi
      - name: Upload SAST report
        uses: actions/upload-artifact@v7
        if: ${{ always() && steps.sast-scan.outcome != 'skipped' }}
        with:
          name: semgrep-sast
          path: ${{ runner.temp }}/semgrep/semgrep.sarif
          if-no-files-found: error
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}
          overwrite: true
    env:
      SEMGREP_RULES: |-
        generic/nginx/security
      SAST_TARGETS: |-
        nginx.conf
        proxy-common.conf

  image-scan:
    name: SCA (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
    steps:
      - name: Download built image
        uses: actions/download-artifact@v8
        with:
          name: runtime-image
          path: ${{ runner.temp }}/image
      - name: Load built image
        run: docker image load --input "${RUNNER_TEMP}/image/runtime-image.tar"
      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Scan runtime image and enforce fixable CVE policy
        id: image-scan
        shell: bash
        run: |
          set -Eeuo pipefail
          raw_report="${RUNNER_TEMP}/trivy-raw.json"
          trivy image --image-src docker --scanners vuln,secret \
            --pkg-types os,library --format json --timeout "${IMAGE_SCAN_TIMEOUT}" \
            --output "${raw_report}" "${IMAGE_NAME}"
          jq 'del(.Metadata.ImageConfig) | (.Results[]?.Secrets[]?) |=
              {RuleID, Category, Severity, Title, StartLine, EndLine}' \
            "${raw_report}" > "${RUNNER_TEMP}/trivy-image.json"

          trivy image --image-src docker --scanners vuln \
            --pkg-types os,library --severity "${IMAGE_SCAN_SEVERITY}" \
            --ignore-unfixed --exit-code 1 --skip-db-update --timeout "${IMAGE_SCAN_TIMEOUT}" \
            "${IMAGE_NAME}"
      - name: Upload image security report
        if: ${{ always() && steps.image-scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-${{ github.event.repository.name }}
          path: ${{ runner.temp }}/trivy-image.json
          retention-days: ${{ env.REPORT_RETENTION_DAYS }}
          if-no-files-found: error
          overwrite: true

  gateway:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download built image
        uses: actions/download-artifact@v8
        with:
          name: runtime-image
          path: ${{ runner.temp }}/image
      - name: Load built image
        run: docker image load --input "${RUNNER_TEMP}/image/runtime-image.tar"
      - name: Smoke-test gateway behavior
        shell: bash
        run: |
          set -Eeuo pipefail

          container_name="${GITHUB_REPOSITORY##*/}-smoke-${GITHUB_RUN_ID}"
          live_headers="$(mktemp)"
          live_body="$(mktemp)"
          not_found_headers="$(mktemp)"
          not_found_body="$(mktemp)"

          cleanup() {
            exit_code=$?
            if [ "${exit_code}" -ne 0 ]; then
              docker logs "${container_name}" || true
            fi
            docker stop "${container_name}" >/dev/null 2>&1 || true
            exit "${exit_code}"
          }
          trap cleanup EXIT

          docker run --detach --rm \
            --name "${container_name}" \
            --publish 127.0.0.1:18080:8080 \
            "${IMAGE_NAME}"

          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/health/live >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error \
            --header 'X-Request-Id: client-controlled' \
            --dump-header "${live_headers}" \
            --output "${live_body}" \
            http://127.0.0.1:18080/health/live
          grep --quiet '"status":"ok"' "${live_body}"

          gateway_request_id="$(
            awk 'BEGIN { IGNORECASE=1 } /^X-Request-Id:/ { gsub("\r", ""); print $2 }' \
              "${live_headers}"
          )"
          test -n "${gateway_request_id}"
          test "${gateway_request_id}" != "client-controlled"

          ready_status="$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              http://127.0.0.1:18080/health/ready
          )"
          test "${ready_status}" = "200"

          not_found_status="$(
            curl --silent --show-error \
              --dump-header "${not_found_headers}" \
              --output "${not_found_body}" \
              --write-out '%{http_code}' \
              http://127.0.0.1:18080/not-found
          )"
          test "${not_found_status}" = "404"
          grep --ignore-case --quiet '^x-request-id:' "${not_found_headers}"
          grep --quiet '"code":"gateway.route_not_found"' "${not_found_body}"

  # Required by the main branch ruleset.
  docker-summary:
    name: NGINX validation and smoke test
    needs: [build, sast, image-scan, gateway]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all prerequisite jobs to pass
        shell: bash
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: jq --exit-status 'length > 0 and all(.[]; .result == "success")' <<< "${CI_RESULTS}"
