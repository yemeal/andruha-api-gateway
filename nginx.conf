user nginx;
worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format gateway escape=json
        '{"time":"$time_iso8601",'
        '"requestId":"$request_id",'
        '"remoteAddr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"requestTime":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status",'
        '"upstreamTime":"$upstream_response_time"}';

    access_log /dev/stdout gateway;

    server_tokens off;
    client_max_body_size 16m;
    send_timeout 15s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Ignore client Authorization and derive it only from the trusted access cookie.
    # An empty value makes proxy_set_header omit Authorization for public routes.
    map $cookie_access_token $internal_authorization {
        '' '';
        default "Bearer $cookie_access_token";
    }

    upstream identity_service {
        zone identity_service 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        server identity-service:8001 resolve;
        keepalive 16;
    }

    upstream user_profile_service {
        zone user_profile_service 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        server user-profile-service:8002 resolve;
        keepalive 16;
    }

    upstream messages_dialogues_service {
        zone messages_dialogues_service 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        server messages-dialogues-service:8003 resolve;
        keepalive 32;
    }

    upstream websocket_gateway_service {
        zone websocket_gateway_service 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        server websocket-gateway-service:8004 resolve;
        keepalive 32;
    }

    upstream object_storage_service {
        zone object_storage_service 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        resolver_timeout 2s;
        server object-storage-service:8005 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        proxy_connect_timeout 2s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        # NGINX $request_id is generated at the edge and never trusts a client value.
        add_header X-Request-Id $request_id always;

        location = /health/live {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /health/ready {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ready"}';
        }

        location ^~ /api/v1/auth/ {
            include /etc/nginx/proxy-common.conf;
            proxy_pass http://identity_service;
        }

        location ^~ /api/v1/profiles/ {
            include /etc/nginx/proxy-common.conf;
            proxy_pass http://user_profile_service;
        }

        location = /api/v1/profiles {
            include /etc/nginx/proxy-common.conf;
            proxy_pass http://user_profile_service;
        }

        location ^~ /api/v1/settings/ {
            include /etc/nginx/proxy-common.conf;
            proxy_pass http://user_profile_service;
        }

        location ^~ /api/v1/dialogues/ {
            include /etc/nginx/proxy-common.conf;
            proxy_pass http://messages_dialogues_service;
        }

        location ^~ /api/v1/messages/ {
            include /etc/nginx/proxy-common.conf;
            proxy_pass http://messages_dialogues_service;
        }

        location ^~ /api/v1/objects/ {
            include /etc/nginx/proxy-common.conf;
            proxy_pass http://object_storage_service;
        }

        location /ws {
            include /etc/nginx/proxy-common.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_pass http://websocket_gateway_service;
        }

        location / {
            default_type application/json;
            return 404 '{"code":"gateway.route_not_found","detail":"route not found"}';
        }
    }
}
